<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>টুয়েন্টি স্কোরবোর্ড</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0e3b2e;
    --felt-deep:#092822;
    --felt-line: rgba(245,239,224,0.08);
    --cream:#f5efe0;
    --cream-dim:#d9d0b8;
    --gold:#c99a3b;
    --gold-soft:#e8c877;
    --teal:#3b8a9c;
    --teal-soft:#7fc4d3;
    --fail:#a93b3b;
    --ink:#1f2a22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri','Inter',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--felt) 0%, var(--felt-deep) 100%);
    color:var(--cream);
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  h1.title{
    font-family:'Fraunces','Hind Siliguri',serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
    text-align:center;
    margin:6px 0 2px;
    color:var(--cream);
  }
  .subtitle{
    text-align:center;
    font-size:12.5px;
    color:var(--cream-dim);
    letter-spacing:0.04em;
    margin-bottom:20px;
  }
  .subtitle .rnd{
    font-family:'JetBrains Mono',monospace;
    color:var(--gold-soft);
    font-weight:700;
  }

  /* card tile */
  .card{
    background: linear-gradient(180deg, rgba(245,239,224,0.06), rgba(245,239,224,0.02));
    border:1px solid var(--felt-line);
    border-radius:14px;
    padding:14px;
    position:relative;
    overflow:hidden;
  }

  /* setup */
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .setup-team-label{
    grid-column:1/-1;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin-top:6px;
    display:flex;align-items:center;gap:8px;
  }
  .setup-team-label:first-child{margin-top:0;}
  .setup-team-label::after{content:"";flex:1;height:1px;background:var(--felt-line);}
  input.name-input{
    width:100%;
    background:rgba(0,0,0,0.2);
    border:1px solid var(--felt-line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--cream);
    font-family:'Hind Siliguri',sans-serif;
    font-size:14.5px;
  }
  input.name-input:focus{outline:2px solid var(--gold-soft);outline-offset:1px;}
  input.name-input::placeholder{color:var(--cream-dim);opacity:0.6;}

  button{font-family:inherit;cursor:pointer;}
  .btn-primary{
    width:100%;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#241a05;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    margin-top:6px;
  }
  .btn-primary:active{transform:translateY(1px);}
  .btn-ghost{
    width:100%;
    background:transparent;
    border:1px solid var(--felt-line);
    color:var(--cream-dim);
    border-radius:12px;
    padding:11px;
    font-size:13.5px;
    margin-top:8px;
  }

  /* scoreboard */
  .team-block{margin-bottom:14px;}
  .team-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px;margin-bottom:8px;
  }
  .team-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
  }
  .team-total{
    font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;
  }
  .teamA .team-name, .teamA .team-total{color:var(--gold-soft);}
  .teamB .team-name, .teamB .team-total{color:var(--teal-soft);}

  .player-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .player-card{
    padding:12px 12px 14px;
    border-radius:12px;
    position:relative;
  }
  .teamA .player-card{background:rgba(201,154,59,0.10);border:1px solid rgba(201,154,59,0.28);}
  .teamB .player-card{background:rgba(59,138,156,0.10);border:1px solid rgba(59,138,156,0.28);}
  .suit-mark{
    position:absolute;top:8px;right:10px;font-size:15px;opacity:0.55;
  }
  .teamA .suit-mark{color:var(--gold-soft);}
  .teamB .suit-mark{color:var(--teal-soft);}
  .player-name{
    font-size:13px;font-weight:600;color:var(--cream);
    max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .player-score{
    font-family:'JetBrains Mono',monospace;
    font-size:26px;font-weight:700;
    margin-top:4px;color:var(--cream);
  }
  .player-score.neg{color:#e08a8a;}

  /* round entry */
  .round-entry{margin-top:18px;}
  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--cream-dim);margin:0 0 10px 4px;
  }
  .entry-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;margin-bottom:8px;
  }
  .teamA-row{background:rgba(201,154,59,0.08);border:1px solid rgba(201,154,59,0.2);}
  .teamB-row{background:rgba(59,138,156,0.08);border:1px solid rgba(59,138,156,0.2);}
  .entry-name{
    flex:0 0 84px;font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  input.bid-input{
    flex:0 0 64px;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--felt-line);
    border-radius:8px;
    color:var(--cream);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;font-weight:700;
    padding:8px 6px;text-align:center;
  }
  input.bid-input:focus{outline:2px solid var(--gold-soft);}
  .result-toggle{
    flex:1;display:flex;gap:6px;
  }
  .toggle-btn{
    flex:1;
    border:1px solid var(--felt-line);
    background:rgba(0,0,0,0.15);
    color:var(--cream-dim);
    border-radius:8px;
    padding:8px 4px;
    font-size:12px;font-weight:600;
  }
  .toggle-btn.win.active{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241a05;border-color:transparent;}
  .toggle-btn.lose.active{background:linear-gradient(180deg,#c95a5a,var(--fail));color:#fff;border-color:transparent;}

  .save-round-btn{margin-top:4px;}
  .save-round-btn:disabled{opacity:0.4;pointer-events:none;}

  /* history */
  .history{margin-top:22px;}
  .history-table{width:100%;border-collapse:collapse;font-size:12px;}
  .history-table th{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;font-size:10px;letter-spacing:0.05em;
    color:var(--cream-dim);text-align:center;padding:6px 3px;
    border-bottom:1px solid var(--felt-line);
  }
  .history-table td{
    text-align:center;padding:7px 3px;
    font-family:'JetBrains Mono',monospace;
    border-bottom:1px solid rgba(245,239,224,0.05);
  }
  .history-table td.rnd-num{color:var(--cream-dim);font-size:11px;}
  .cell-win{color:var(--gold-soft);}
  .cell-lose{color:#e08a8a;}
  .empty-hist{
    text-align:center;color:var(--cream-dim);font-size:12.5px;
    padding:18px 0;
  }

  .hidden{display:none !important;}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .icon-btn{
    background:none;border:none;color:var(--cream-dim);
    font-size:12px;padding:4px 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1 class="title">টুয়েন্টি স্কোরবোর্ড</h1>
  <div class="subtitle" id="subtitle">চারজন খেলোয়াড়, দুই পেয়ার</div>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="card">
    <div class="setup-grid">
      <div class="setup-team-label">পেয়ার ১</div>
      <input class="name-input" id="p0" placeholder="খেলোয়াড় ১ এর নাম" />
      <input class="name-input" id="p1" placeholder="খেলোয়াড় ২ এর নাম" />
      <div class="setup-team-label">পেয়ার ২</div>
      <input class="name-input" id="p2" placeholder="খেলোয়াড় ৩ এর নাম" />
      <input class="name-input" id="p3" placeholder="খেলোয়াড় ৪ এর নাম" />
    </div>
    <button class="btn-primary" id="startBtn">খেলা শুরু করুন</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">

    <div class="top-actions">
      <button class="icon-btn" id="resetBtn">↺ নতুন খেলা</button>
    </div>

    <div class="team-block teamA">
      <div class="team-head">
        <span class="team-name" id="teamAName">পেয়ার ১</span>
        <span class="team-total" id="teamATotal">0</span>
      </div>
      <div class="player-pair">
        <div class="player-card">
          <span class="suit-mark">♠</span>
          <div class="player-name" id="name0"></div>
          <div class="player-score" id="score0">0</div>
        </div>
        <div class="player-card">
          <span class="suit-mark">♥</span>
          <div class="player-name" id="name1"></div>
          <div class="player-score" id="score1">0</div>
        </div>
      </div>
    </div>

    <div class="team-block teamB">
      <div class="team-head">
        <span class="team-name" id="teamBName">পেয়ার ২</span>
        <span class="team-total" id="teamBTotal">0</span>
      </div>
      <div class="player-pair">
        <div class="player-card">
          <span class="suit-mark">♦</span>
          <div class="player-name" id="name2"></div>
          <div class="player-score" id="score2">0</div>
        </div>
        <div class="player-card">
          <span class="suit-mark">♣</span>
          <div class="player-name" id="name3"></div>
          <div class="player-score" id="score3">0</div>
        </div>
      </div>
    </div>

    <div class="round-entry">
      <div class="section-label">এই রাউন্ডের নাম্বার ও ফলাফল</div>
      <div id="entryRows"></div>
      <button class="btn-primary save-round-btn" id="saveRoundBtn" disabled>রাউন্ড সেভ করুন</button>
    </div>

    <div class="history">
      <div class="section-label">রাউন্ড হিস্ট্রি</div>
      <div id="historyWrap">
        <div class="empty-hist">এখনো কোনো রাউন্ড সেভ হয়নি</div>
      </div>
    </div>

  </div>

</div>

<script>
(function(){
  const STORAGE_KEY = 'twenty-game-state';
  let state = null; // {players:[{name}], rounds:[{bids:[n,n,n,n], results:[bool,bool,bool,bool]}]}

  const $ = id => document.getElementById(id);

  function defaultState(){
    return { players: [], rounds: [] };
  }

  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        state = JSON.parse(res.value);
      } else {
        state = defaultState();
      }
    }catch(e){
      state = defaultState();
    }
    render();
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){
      console.error('Storage save failed', e);
    }
  }

  function computeScores(){
    const scores = [0,0,0,0];
    state.rounds.forEach(r=>{
      r.bids.forEach((bid,i)=>{
        scores[i] += r.results[i] ? bid : -bid;
      });
    });
    return scores;
  }

  function render(){
    if(!state.players || state.players.length < 4){
      $('setupScreen').classList.remove('hidden');
      $('gameScreen').classList.add('hidden');
      $('subtitle').textContent = 'চারজন খেলোয়াড়, দুই পেয়ার';
      return;
    }
    $('setupScreen').classList.add('hidden');
    $('gameScreen').classList.remove('hidden');
    $('subtitle').innerHTML = 'রাউন্ড <span class="rnd">' + (state.rounds.length + 1) + '</span> চলছে';

    const names = state.players.map(p=>p.name);
    for(let i=0;i<4;i++){ $('name'+i).textContent = names[i]; }
    $('teamAName').textContent = names[0] + ' ও ' + names[1];
    $('teamBName').textContent = names[2] + ' ও ' + names[3];

    const scores = computeScores();
    for(let i=0;i<4;i++){
      const el = $('score'+i);
      el.textContent = scores[i];
      el.classList.toggle('neg', scores[i] < 0);
    }
    const teamA = scores[0] + scores[1];
    const teamB = scores[2] + scores[3];
    $('teamATotal').textContent = teamA;
    $('teamBTotal').textContent = teamB;

    renderEntryRows(names);
    renderHistory(names);
  }

  function renderEntryRows(names){
    const wrap = $('entryRows');
    wrap.innerHTML = '';
    const teamClass = ['teamA-row','teamA-row','teamB-row','teamB-row'];
    for(let i=0;i<4;i++){
      const row = document.createElement('div');
      row.className = 'entry-row ' + teamClass[i];
      row.innerHTML =
        '<div class="entry-name">'+ escapeHtml(names[i]) +'</div>' +
        '<input type="number" inputmode="numeric" class="bid-input" id="bid'+i+'" placeholder="নং" min="0" />' +
        '<div class="result-toggle">' +
          '<button type="button" class="toggle-btn win" data-idx="'+i+'" data-val="win">✓ তুলেছে</button>' +
          '<button type="button" class="toggle-btn lose" data-idx="'+i+'" data-val="lose">✗ পারেনি</button>' +
        '</div>';
      wrap.appendChild(row);
    }

    // state for current entry (not saved yet)
    window._entryResults = [null,null,null,null];

    wrap.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.idx,10);
        const val = btn.dataset.val;
        window._entryResults[idx] = (val === 'win');
        const siblings = wrap.querySelectorAll('.toggle-btn[data-idx="'+idx+'"]');
        siblings.forEach(s=>s.classList.remove('active'));
        btn.classList.add('active');
        updateSaveBtnState();
      });
    });
    wrap.querySelectorAll('.bid-input').forEach(inp=>{
      inp.addEventListener('input', updateSaveBtnState);
    });
    updateSaveBtnState();
  }

  function updateSaveBtnState(){
    let ready = true;
    for(let i=0;i<4;i++){
      const v = $('bid'+i).value;
      if(v === '' || isNaN(parseFloat(v)) || window._entryResults[i] === null){
        ready = false;
      }
    }
    $('saveRoundBtn').disabled = !ready;
  }

  function renderHistory(names){
    const wrap = $('historyWrap');
    if(state.rounds.length === 0){
      wrap.innerHTML = '<div class="empty-hist">এখনো কোনো রাউন্ড সেভ হয়নি</div>';
      return;
    }
    let html = '<table class="history-table"><thead><tr><th>রাউন্ড</th>';
    names.forEach(n=>{ html += '<th>'+escapeHtml(shorten(n))+'</th>'; });
    html += '</tr></thead><tbody>';
    state.rounds.forEach((r, idx)=>{
      html += '<tr><td class="rnd-num">'+(idx+1)+'</td>';
      r.bids.forEach((bid,i)=>{
        const cls = r.results[i] ? 'cell-win' : 'cell-lose';
        const sign = r.results[i] ? '+' : '−';
        html += '<td class="'+cls+'">'+sign+bid+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  function shorten(name){
    return name.length > 6 ? name.slice(0,6)+'…' : name;
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  $('startBtn').addEventListener('click', ()=>{
    const vals = [0,1,2,3].map(i=>$('p'+i).value.trim());
    const filled = vals.map((v,i)=> v || ('খেলোয়াড় '+(i+1)));
    state.players = filled.map(n=>({name:n}));
    state.rounds = [];
    saveState();
    render();
  });

  $('resetBtn').addEventListener('click', ()=>{
    if(confirm('নতুন খেলা শুরু করলে বর্তমান স্কোর মুছে যাবে। আপনি কি নিশ্চিত?')){
      state = defaultState();
      saveState();
      render();
    }
  });

  $('saveRoundBtn').addEventListener('click', ()=>{
    const bids = [0,1,2,3].map(i=> parseFloat($('bid'+i).value));
    const results = window._entryResults.slice();
    if(bids.some(b=>isNaN(b)) || results.some(r=>r===null)) return;
    state.rounds.push({ bids, results });
    saveState();
    render();
  });

  loadState();
})();
</script>
</body>
</html>
